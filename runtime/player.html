<body>
<div id="viewport">
  <div id="stage">
    <div id="ambient"></div>
    <div id="scenes"></div>
    <div id="overlay">
      <div id="watermark"></div>
      <div id="captions"></div>
    </div>
  </div>
</div>
<div id="controls" hidden>
  <button id="btnPlay" title="Phát / Dừng (Space)">
    <svg id="icoPlay" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>
    <svg id="icoPause" viewBox="0 0 24 24" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
  </button>
  <span id="time">0:00 / 0:00</span>
  <div id="scrub"><div id="scrubMarks"></div><div id="scrubFill"></div><div id="scrubKnob"></div></div>
  <span id="sceneLabel"></span>
  <button id="btnFull" title="Toàn màn hình (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
</div>
<div id="errorToast" hidden></div>
<audio id="audio" preload="auto"></audio>

<script src="/runtime/gfx.js"></script>
